<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krypto — FinanceHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    body { font-family:'Inter',sans-serif; background:#f8f9fa; color:#202124; }
    .glass { background:rgba(255,255,255,0.9); border:1px solid rgba(26,115,232,0.15); border-radius:1.5rem; padding:2rem; }
</style>
</head>
<body class="min-h-screen p-6 lg:p-10">
<header class="mb-8 flex items-center justify-between relative">
    <a href="index.html" class="text-sm text-blue-600 hover:underline"><i class="fa-solid fa-arrow-left mr-2"></i>Powrót</a>
    <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-3">
        <i class="fa-solid fa-coins text-3xl text-blue-600"></i>
        <h1 class="text-4xl font-black tracking-tight text-blue-600">FINANCE HUB</h1>
    </div>
</header>
<main class="max-w-6xl mx-auto">
    <h2 class="text-3xl font-black mb-6">Kryptowaluty — szczegóły</h2>
    <div class="glass overflow-x-auto">
        <table class="w-full text-sm">
            <thead><tr class="border-b"><th class="text-left py-3">Symbol</th><th>Cena</th><th>Dzienna zmiana</th><th>Tygodniowa</th><th>Miesięczna</th><th>Wykres</th></tr></thead>
            <tbody class="divide-y divide-slate-100">
                <tr><td class="py-3 font-bold">BTC</td><td>$64,933</td><td class="text-rose-500">-1.2%</td><td class="text-rose-500">-2.5%</td><td class="text-emerald-600">+4.1%</td><td><a href="chart.html?symbol=BTC" class="text-blue-600 hover:underline">Wykres →</a></td></tr>
                <tr><td class="py-3 font-bold">ETH</td><td>$1,918.1</td><td class="text-emerald-600">+0.8%</td><td class="text-emerald-600">+3.2%</td><td class="text-rose-500">-1.1%</td><td><a href="chart.html?symbol=ETH" class="text-blue-600 hover:underline">Wykres →</a></td></tr>
                <tr><td class="py-3 font-bold">BNB</td><td>$312.4</td><td class="text-rose-500">-0.5%</td><td class="text-emerald-600">+1.2%</td><td class="text-emerald-600">+5.3%</td><td><a href="chart.html?symbol=BNB" class="text-blue-600 hover:underline">Wykres →</a></td></tr>
                <tr><td class="py-3 font-bold">SOL</td><td>$128.7</td><td class="text-emerald-600">+2.1%</td><td class="text-emerald-600">+8.4%</td><td class="text-emerald-600">+12.3%</td><td><a href="chart.html?symbol=SOL" class="text-blue-600 hover:underline">Wykres →</a></td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
