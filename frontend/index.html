<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceHub - Platforma Inwestycyjna</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/charts.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- TradingView Lightweight Charts SDK -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <!-- Dodaj przycisk do wyświetlania wykresu -->
    <button id="showChartButton">wig20.wa</button>
    
    <!-- Kontener na wykres po prawej stronie -->
    <div id="chartContainer" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 60%; height: 400px; background: #f0f0f0; border: 1px solid #ccc; padding: 10px;"></div>
    
    <!-- Reszta istniejącego zawartości -->
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
    
    <!-- Dodaj skrypt do obsługi przycisku -->
    <script>
        document.getElementById('showChartButton').addEventListener('click', function() {
            // Pobierz dane z API dla ticker "wig20.wa"
            fetch('https://api.example.com/data/wig20.wa') // Zastąp URL swoim API
                .then(response => {
                    if (!response.ok) throw new Error('Błąd pobierania danych');
                    return response.json();
                })
                .then(data => {
                    // Inicjalizacja wykresu z danymi z API
                    const chart = lightweightCharts.create({
                        container: document.getElementById('chartContainer'),
                        width: 600,
                        height: 400,
                        timeScale: {
                            timeVisible: true,
                            timeVisiblePerc: 100
                        }
                    });
                    
                    // Dodaj serię danych
                    const series = chart.addSeries({
                        color: 'blue',
                        data: data.map(item => ({ time: item.time, value: item.price }))
                    });
                })
                .catch(error => {
                    console.error('Błąd:', error);
                    alert('Nie można załadować danych dla wig20.wa');
                });
        });
    </script>
</body>
</html>
