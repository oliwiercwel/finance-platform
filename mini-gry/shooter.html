<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Kosmiczny Strzelec</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .score {
            font-size: 1.5rem;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 10px 30px;
            border-radius: 25px;
            display: inline-block;
        }

        canvas {
            background: #0a0a1a;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .controls {
            margin-top: 20px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 40px;
            background: #fff;
            color: #667eea;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 30px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            font-size: 1rem;
            text-decoration: none;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .game-over.show {
            display: flex;
        }

        .game-over h2 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🚀 Kosmiczny Strzelec</h1>
        <div class="score">Punkty: <span id="score">0</span></div>
        <canvas id="game" width="600" height="400"></canvas>
        <div class="controls">Sterowanie: Strzałki ← → | Strzał: Spacja</div>
        <button class="btn" id="restartBtn">🔄 Zagraj ponownie</button>
        <br>
        <a href="index.html" class="back-btn">← Powrót do menu</a>
    </div>

    <div class="game-over" id="gameOver">
        <h2>💥 Statek zniszczony!</h2>
        <p>Twój wynik: <span id="finalScore">0</span></p>
        <button class="btn" id="playAgainBtn">🔄 Zagraj ponownie</button>
        <br>
        <a href="index.html" class="back-btn">← Powrót do menu</a>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        // Statek gracza
        const player = {
            x: 280,
            y: 350,
            width: 40,
            height: 30,
            speed: 5
        };

        // Pociski
        let bullets = [];
        const bulletSpeed = 7;

        // Asteroidy
        let asteroids = [];
        const asteroidSpeed = 2;

        let score = 0;
        let gameRunning = false;
        let gameLoop;
        let keys = {};

        function createAsteroid() {
            const size = Math.random() * 30 + 20;
            // Zapisz kształt asteroidy przy tworzeniu (żeby nie migał w draw)
            const shape = [];
            for (let i = 0; i < 8; i++) {
                shape.push(0.8 + Math.random() * 0.4);
            }
            asteroids.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: Math.random() * 2 + 1,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.1,
                shape: shape
            });
        }

        function draw() {
            // Tło
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gwiazdy (statyczne)
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for (let i = 0; i < 50; i++) {
                const x = (i * 97) % canvas.width;
                const y = (i * 53) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }

            // Statek gracza
            ctx.save();
            ctx.translate(player.x + player.width/2, player.y + player.height/2);
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-15, 15);
            ctx.lineTo(15, 15);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Pociski
            ctx.fillStyle = '#fbbf24';
            for (let bullet of bullets) {
                ctx.fillRect(bullet.x - 2, bullet.y - 8, 4, 16);
            }

            // Asteroidy
            for (let asteroid of asteroids) {
                ctx.save();
                ctx.translate(asteroid.x + asteroid.size/2, asteroid.y + asteroid.size/2);
                ctx.rotate(asteroid.rotation);
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const radius = asteroid.size / 2 * asteroid.shape[i];
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function update() {
            // Ruch gracza
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Ruch pocisków
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Ruch asteroid
            for (let i = asteroids.length - 1; i >= 0; i--) {
                asteroids[i].y += asteroids[i].speed;
                asteroids[i].rotation += asteroids[i].rotationSpeed;
                if (asteroids[i].y > canvas.height) {
                    asteroids.splice(i, 1);
                }
            }

            // Kolizje pocisków z asteroidami
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const bullet = bullets[i];
                    const asteroid = asteroids[j];
                    if (bullet && asteroid &&
                        bullet.x > asteroid.x && bullet.x < asteroid.x + asteroid.size &&
                        bullet.y > asteroid.y && bullet.y < asteroid.y + asteroid.size) {
                        bullets.splice(i, 1);
                        asteroids.splice(j, 1);
                        score += 10;
                        scoreEl.textContent = score;
                        break;
                    }
                }
            }

            // Kolizja gracza z asteroidami
            for (let asteroid of asteroids) {
                if (player.x < asteroid.x + asteroid.size &&
                    player.x + player.width > asteroid.x &&
                    player.y < asteroid.y + asteroid.size &&
                    player.y + player.height > asteroid.y) {
                    gameOver();
                    return;
                }
            }

            // Tworzenie nowych asteroid
            if (Math.random() < 0.02) {
                createAsteroid();
            }
        }

        function shoot() {
            if (!gameRunning) return;
            bullets.push({
                x: player.x + player.width/2,
                y: player.y
            });
        }

        function gameLoopFunction() {
            update();
            draw();
        }

        function startGame() {
            player.x = 280;
            bullets = [];
            asteroids = [];
            score = 0;
            scoreEl.textContent = 0;
            gameRunning = true;
            gameOverEl.classList.remove('show');
            clearInterval(gameLoop);
            gameLoop = setInterval(gameLoopFunction, 16);
            // Startowe asteroidy
            for (let i = 0; i < 3; i++) {
                createAsteroid();
            }
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScoreEl.textContent = score;
            gameOverEl.classList.add('show');
        }

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                shoot();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('playAgainBtn').addEventListener('click', startGame);

        // Start gry
        startGame();
    </script>
</body>
</html>
